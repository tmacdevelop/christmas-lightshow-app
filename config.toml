# Default runtime configuration for `lightshow-api`.
# Override the path with the `LIGHTSHOW_CONFIG` environment variable.

# Number of virtual pixels in the strip.
pixel_count = 60

# Target frame rate for the show engine.
fps = 60

# Address the HTTP/WebSocket server binds to.
bind = "127.0.0.1:3000"

# Built-in effect played at startup. One of: "solid", "fade", "chase", "rainbow".
effect = "chase"

# Directory holding saved sequence JSON files (Phase 3 sequencer).
shows_dir = "shows"

# Directory holding saved layout JSON files (Phase 3 layout designer).
layouts_dir = "layouts"
