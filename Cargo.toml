[workspace]
resolver = "3"
members = [
    "crates/controller",
    "crates/sequencer",
    "crates/audio",
    "crates/api",
    "crates/spotify",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tylerwoody/christmas-lightshow-app"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# Async runtime & web
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["trace"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# Logging & errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"

# Audio
symphonia = { version = "0.5", features = ["mp3", "aac", "ogg", "flac", "wav"] }
rustfft = "6"

# Spotify integration (Phase: SPOTIFY_PLAN.md)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
aes-gcm = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
url = "2"
dotenvy = "0.15"

# Workspace-internal crates
controller = { path = "crates/controller" }
sequencer = { path = "crates/sequencer" }
audio = { path = "crates/audio" }
spotify = { path = "crates/spotify" }
