[workspace]
resolver = "3"
members = [
    "crates/controller",
    "crates/sequencer",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tylerwoody/christmas-lightshow-app"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# Real shared dependencies land in Phase 1.
